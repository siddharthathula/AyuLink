; AyuLink Smart Pill Dispenser — ESP32-S3
; =========================================
; Board   : ESP32-S3-DevKitC-1 (or ESP32-S3 Zero / SuperMini)
; Pins    : 3, 4, 5, 6, 7, 8, 10, 15 ONLY
; =========================================

[env:esp32-s3-devkitc-1]
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

; Enable USB-CDC serial for USB-native ESP32-S3 boards
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D ARDUINO_USB_MODE=0
    -D CORE_DEBUG_LEVEL=5

lib_deps =
    ; WebSocket client (for dashboard connection)
    links2004/WebSockets @ ^2.4.1

    ; JSON serialization/deserialization
    bblanchon/ArduinoJson @ ^7.0.0

    ; Servo library for ESP32 (NOT standard Arduino Servo)
    madhephaestus/ESP32Servo @ ^3.0.4
